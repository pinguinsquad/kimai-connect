name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build und Tests
        run: mvn -B --no-transfer-progress verify

      - name: Testergebnisse in Job-Summary
        if: always()
        run: |
          {
            echo "## Tests"
            echo '| Klasse | Tests | Fehler | Fehlschläge | Übersprungen |'
            echo '|---|---|---|---|---|'
            for f in target/surefire-reports/TEST-*.xml; do
              [ -e "$f" ] || continue
              sed -n 's/.*<testsuite[^>]*name="\([^"]*\)"[^>]*tests="\([0-9]*\)"[^>]*errors="\([0-9]*\)"[^>]*failures="\([0-9]*\)"[^>]*skipped="\([0-9]*\)".*/| \1 | \2 | \3 | \4 | \5 |/p' "$f" | head -1
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test-Reports als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
