name: Mark stale issues and pull requests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 28
          days-before-close: 62
          stale-issue-message: 'Lange nichts passiert. Braucht es das noch?'
          stale-pr-message: 'Lange nichts passiert. Braucht es das noch?'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
