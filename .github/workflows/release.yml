name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # vollständige Historie für die main-Prüfung

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: github   # Server-ID aus distributionManagement in pom.xml
          # setup-java trägt GITHUB_ACTOR/GITHUB_TOKEN als Zugangsdaten in settings.xml ein

      - name: Tag gegen main und pom.xml prüfen
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag v$VERSION liegt nicht auf main – Releases werden nur von main gebaut"
            exit 1
          fi
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$POM_VERSION" != "$VERSION" ]; then
            echo "::error::Tag v$VERSION passt nicht zur pom.xml-Version $POM_VERSION (erwartet $VERSION, ohne -SNAPSHOT)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, Tests und Deploy nach GitHub Packages
        run: mvn -B --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "target/kimai-connect-$VERSION-exec.jar#kimai-connect-$VERSION-exec.jar (ausführbar)" \
            "target/kimai-connect-$VERSION.jar#kimai-connect-$VERSION.jar (Bibliothek)"
