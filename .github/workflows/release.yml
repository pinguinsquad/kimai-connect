name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: github   # Server-ID aus distributionManagement in pom.xml
          # setup-java trägt GITHUB_ACTOR/GITHUB_TOKEN als Zugangsdaten in settings.xml ein

      - name: Version aus pom.xml lesen und Tag prüfen
        id: version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$VERSION" in
            *-SNAPSHOT) echo "::error::SNAPSHOT-Versionen sind auf main nicht erlaubt ($VERSION)"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION existiert bereits – Version in pom.xml muss erhöht werden"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, Tests und Deploy nach GitHub Packages
        run: mvn -B --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag setzen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "target/kimai-connect-$VERSION-exec.jar#kimai-connect-$VERSION-exec.jar (ausführbar)" \
            "target/kimai-connect-$VERSION.jar#kimai-connect-$VERSION.jar (Bibliothek)"
